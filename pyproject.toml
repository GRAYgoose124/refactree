[project]
name = "refactree"
version = "0.1.0"
description = "Advanced Python file refactorer with AST analysis, dependency graphing, and intelligent code organization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0",
    "nltk>=3.9.2",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
refactree = "refactree.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
